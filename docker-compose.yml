name: ${COMPOSE_PROJECT_NAME:-observability-labs}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:
  db:
    <<: *service-defaults
    image: postgres:17.6-alpine
    container_name: obs-lab-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_USER: ${POSTGRES_USER:-orders_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders_app_lab_password}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net

  redis:
    <<: *service-defaults
    image: redis:8.2.1-alpine
    container_name: obs-lab-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-net

  app:
    <<: *service-defaults
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runtime
    image: observability-labs/orders-api:1.0.0
    container_name: obs-lab-app
    environment:
      APP_NAME: Observable Orders API
      APP_VERSION: 1.0.0
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-lab}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_BUILD_SHA: ${APP_BUILD_SHA:-development}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-orders_app}:${POSTGRES_PASSWORD:-orders_app_lab_password}@db:5432/${POSTGRES_DB:-orders}
      APP_REDIS_URL: redis://redis:6379/0
      APP_CACHE_TTL_SECONDS: ${APP_CACHE_TTL_SECONDS:-300}
      APP_OTEL_ENABLED: ${APP_OTEL_ENABLED:-true}
      APP_OTEL_SERVICE_NAME: orders-api
      APP_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      APP_OTEL_EXPORTER_OTLP_INSECURE: "true"
      APP_OTEL_TRACE_SAMPLE_RATIO: ${APP_OTEL_TRACE_SAMPLE_RATIO:-1.0}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.5
    networks:
      - app-net
      - monitoring-net

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.14.0
    container_name: obs-lab-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    networks:
      - monitoring-net

  alertmanager:
    <<: *service-defaults
    image: prom/alertmanager:v0.34.0
    container_name: obs-lab-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - monitoring-net

  otel-collector:
    <<: *service-defaults
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: obs-lab-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      MIMIR_REMOTE_WRITE_ENDPOINT: ${MIMIR_REMOTE_WRITE_ENDPOINT:-http://mimir:9009/api/v1/push}
    ports:
      - "127.0.0.1:${OTEL_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_HOST_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_INTERNAL_METRICS_HOST_PORT:-8888}:8888"
      - "127.0.0.1:${OTEL_EXPORTED_METRICS_HOST_PORT:-8889}:8889"
    volumes:
      - ./config/otel-collector/${OTEL_COLLECTOR_CONFIG_FILE:-otel-collector-config.yaml}:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    networks:
      - monitoring-net

  loki:
    <<: *service-defaults
    image: grafana/loki:3.7.7
    container_name: obs-lab-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 768m
    networks:
      - monitoring-net

  tempo:
    <<: *service-defaults
    image: grafana/tempo:3.0.3
    container_name: obs-lab-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200"
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    networks:
      - monitoring-net

  grafana:
    <<: *service-defaults
    image: grafana/grafana:13.2.1
    container_name: obs-lab-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_lab_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_METRICS_ENABLED: "true"
      GF_LOG_MODE: console
      GF_LOG_FORMAT: json
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    networks:
      - monitoring-net

  node-exporter:
    <<: *service-defaults
    image: prom/node-exporter:v1.12.0
    container_name: obs-lab-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    ports:
      - "127.0.0.1:${NODE_EXPORTER_HOST_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    healthcheck:
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-net

networks:
  app-net:
    name: obs-lab-app-net
  monitoring-net:
    name: obs-lab-monitoring-net

volumes:
  postgres-data:
    name: obs-lab-postgres-data
  redis-data:
    name: obs-lab-redis-data
  prometheus-data:
    name: obs-lab-prometheus-data
  alertmanager-data:
    name: obs-lab-alertmanager-data
  grafana-data:
    name: obs-lab-grafana-data
  loki-data:
    name: obs-lab-loki-data
  tempo-data:
    name: obs-lab-tempo-data