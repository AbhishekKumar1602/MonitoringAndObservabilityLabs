# Optional replacement for otel-collector-config.yaml when a Mimir-compatible
# remote-write endpoint is available. This file is not mounted by default.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 80
  batch:
    timeout: 5s

exporters:
  prometheus_remote_write/mimir:
    http:
      endpoint: ${env:MIMIR_REMOTE_WRITE_ENDPOINT}
      # The bundled environment value targets a plaintext lab Mimir. Replace
      # this transport policy when the destination uses HTTPS or mTLS.
      tls:
        insecure: true
    resource_constant_labels:
      included:
        - deployment.environment.name
        - service.namespace
        - service.version
        - vcs.ref.head.revision
    remote_write_queue:
      enabled: true
      queue_size: 10000
    retry_on_failure:
      enabled: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus_remote_write/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
