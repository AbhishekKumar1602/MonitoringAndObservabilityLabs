stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 168h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      environment: lab
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      enable_target_info: true
      dimensions:
        - http.request.method
        - http.response.status_code
        - deployment.environment.name
    service_graphs:
      dimensions:
        - deployment.environment.name
      enable_virtual_node_label: true

overrides:
  defaults:
    metrics_generator:
      processors:
        - span-metrics
        - service-graphs
      max_active_series: 100000

usage_report:
  reporting_enabled: false

