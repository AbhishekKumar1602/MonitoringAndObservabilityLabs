global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: lab
    cluster: single-vm

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: orders-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: orders-api
          telemetry_source: prometheus-client

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          telemetry_source: collector-internal

  - job_name: otel-application-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          telemetry_source: otlp

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

